name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Update llama.cpp submodule
      run: |
        cd llmfarm_core.swift/llama.cpp
        echo "=== Origin URL ==="
        git remote -v
        git fetch --depth=1 origin master
        git checkout origin/master
        git submodule update --init --recursive
        echo "=== llama.cpp обновлён до: $(git rev-parse --short HEAD) ==="
        cd ../../..

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Download demo model (TinyLlama 1.1B Chat Q4_K_M)
      run: |
        curl -L --retry 3 --fail \
          -o "LLMFarm/Settings/[DEMO].gguf" \
          "https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf?download=true"
        ls -lh "LLMFarm/Settings/[DEMO].gguf"

    - name: Stub missing Pythia files (referenced in project.pbxproj)
      run: |
        for i in 1 2 3 4; do
          f="LLMFarm/Settings/Pythia410m-V0-Instruct.Q6_K_split.gguf-0000${i}-of-00004.gguf"
          touch "$f"
          echo "created: $f"
        done
        ls -la LLMFarm/Settings/Pythia*

    - name: Cache llama.xcframework
      id: cache-llama
      uses: actions/cache@v4
      with:
        path: llmfarm_core.swift/llama.cpp/build-apple/llama.xcframework
        key: llama-xcframework-${{ hashFiles('llmfarm_core.swift/llama.cpp/CMakeLists.txt', 'llmfarm_core.swift/llama.cpp/ggml/**', 'llmfarm_core.swift/llama.cpp/src/**') }}
        restore-keys: |
          llama-xcframework-

    - name: Build llama.xcframework
      if: steps.cache-llama.outputs.cache-hit != 'true'
      run: |
        cd llmfarm_core.swift/llama.cpp
        if [ -f "build-xcframework.sh" ]; then
          chmod +x build-xcframework.sh
          ./build-xcframework.sh
        else
          echo "Скрипт build-xcframework.sh не найден!"
          exit 1
        fi
        cd ../../..

    - name: Verify llama.xcframework exists
      run: |
        if [ ! -d "llmfarm_core.swift/llama.cpp/build-apple/llama.xcframework" ]; then
          echo "❌ llama.xcframework отсутствует!"
          exit 1
        fi
        echo "✅ llama.xcframework на месте"

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/org.swift.swiftpm
          .build
          build/SourcePackages
        key: spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
        restore-keys: |
          spm-

    - name: Cache Xcode DerivedData
      uses: actions/cache@v4
      with:
        path: build
        key: derived-${{ hashFiles('LLMFarm/**/*.swift', 'LLMFarm.xcodeproj/project.pbxproj') }}
        restore-keys: |
          derived-

    - name: Build the app (Unsigned)
      run: |
        echo "=== Все схемы проекта ==="
        xcodebuild -list -project LLMFarm.xcodeproj

        SCHEME_NAME=$(xcodebuild -list -project LLMFarm.xcodeproj \
          | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' \
          | grep -i "LLMFarm" \
          | grep -vi "test" \
          | grep -vi "finetune" \
          | head -1 \
          | xargs)

        echo "=== Выбрана схема: $SCHEME_NAME ==="

        if [ -z "$SCHEME_NAME" ]; then
          echo "Не удалось найти подходящую схему!"
          exit 1
        fi

        xcodebuild clean build \
          -project LLMFarm.xcodeproj \
          -scheme "$SCHEME_NAME" \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath ./build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        mkdir -p Payload
        find ./build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -exec cp -r {} Payload/ \;
        zip -r LLMFarm.ipa Payload

    - name: Upload IPA (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: LLMFarm-IPA
        path: LLMFarm.ipa

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

    - name: Get llama.cpp version
      id: llama_version
      run: |
        cd llmfarm_core.swift/llama.cpp
        VERSION=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ steps.date.outputs.date }}
        name: "LLMFarm build ${{ steps.date.outputs.date }}"
        body: |
          Автоматическая сборка LLMFarm.

          **Дата:** ${{ steps.date.outputs.date }}
          **Commit:** ${{ github.sha }}
          **llama.cpp:** ${{ steps.llama_version.outputs.version }}
          **Размер:** ~400 МБ

          Неподписанный `.ipa` — подпиши его в ESign перед установкой.

          **Демо-модель:** TinyLlama 1.1B Chat Q4_K_M.
        files: LLMFarm.ipa
        draft: false
        prerelease: false
