name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    # ЭТАП 1: Собираем llama.xcframework
    - name: Build llama.xcframework
      run: |
        cd llmfarm_core.swift/llama.cpp
        if [ -f "build-xcframework.sh" ]; then
          chmod +x build-xcframework.sh
          ./build-xcframework.sh
        else
          echo "Скрипт build-xcframework.sh не найден!"
          exit 1
        fi
        cd ../../..

    # ЭТАП 2: Собираем приложение (правильная схема подбирается автоматически)
    - name: Build the app (Unsigned)
      run: |
        echo "=== Все схемы проекта ==="
        xcodebuild -list -project LLMFarm.xcodeproj
        
        SCHEME_NAME=$(xcodebuild -list -project LLMFarm.xcodeproj \
          | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' \
          | grep -i "LLMFarm" \
          | grep -vi "test" \
          | grep -vi "finetune" \
          | head -1 \
          | xargs)
        
        echo "=== Выбрана схема: $SCHEME_NAME ==="
        
        if [ -z "$SCHEME_NAME" ]; then
          echo "Не удалось найти подходящую схему!"
          exit 1
        fi
        
        xcodebuild clean build \
          -project LLMFarm.xcodeproj \
          -scheme "$SCHEME_NAME" \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath ./build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        mkdir -p Payload
        find ./build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -exec cp -r {} Payload/ \;
        zip -r LLMFarm.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: LLMFarm-IPA
        path: LLMFarm.ipa
