name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Update llama.cpp submodule
      run: |
        cd llmfarm_core.swift/llama.cpp
        echo "=== Origin URL ==="
        git remote -v
        git fetch --depth=1 origin master
        git checkout origin/master
        git submodule update --init --recursive
        echo "=== llama.cpp обновлён до: $(git rev-parse --short HEAD) ==="
        cd ../../..

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Set app name and version
      run: |
        PLIST="LLMFarm/Info.plist"

        echo "=== Info.plist до правок ==="
        /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" 2>/dev/null || echo "(нет CFBundleDisplayName)"
        /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null || echo "(нет CFBundleShortVersionString)"

        /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LLMFarm playerheart" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string LLMFarm playerheart" "$PLIST"
        /usr/libexec/PlistBuddy -c "Set :CFBundleName LLMFarm playerheart" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string LLMFarm playerheart" "$PLIST"
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 2.0" "$PLIST"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 2.0" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 2.0" "$PLIST"

        echo "=== Info.plist после правок ==="
        /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"
        /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST"
        /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
        /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

    - name: Prepare demo model and stubs
      run: |
        echo "=== Скачиваем Qwen2.5-0.5B-Instruct Q4_K_M под именем Pythia-00001 ==="
        curl -L --retry 3 --fail -o "LLMFarm/Settings/Pythia410m-V0-Instruct.Q6_K_split.gguf-00001-of-00004.gguf" "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf?download=true"
        ls -lh "LLMFarm/Settings/Pythia410m-V0-Instruct.Q6_K_split.gguf-00001-of-00004.gguf"

        echo "=== Создаём пустые заглушки для частей 2-4 ==="
        touch "LLMFarm/Settings/Pythia410m-V0-Instruct.Q6_K_split.gguf-00002-of-00004.gguf"
        touch "LLMFarm/Settings/Pythia410m-V0-Instruct.Q6_K_split.gguf-00003-of-00004.gguf"
        touch "LLMFarm/Settings/Pythia410m-V0-Instruct.Q6_K_split.gguf-00004-of-00004.gguf"

        echo "=== Sanity check ==="
        SIZE=$(stat -f%z "LLMFarm/Settings/Pythia410m-V0-Instruct.Q6_K_split.gguf-00001-of-00004.gguf" 2>/dev/null || stat -c%s "LLMFarm/Settings/Pythia410m-V0-Instruct.Q6_K_split.gguf-00001-of-00004.gguf")
        echo "Размер файла 00001: $SIZE байт"
        if [ "$SIZE" -lt 100000000 ]; then
          echo "ОШИБКА: файл меньше 100 МБ"
          exit 1
        fi
        echo "OK: файл 00001 скачан корректно"

    - name: Cache llama.xcframework
      id: cache-llama
      uses: actions/cache@v4
      with:
        path: llmfarm_core.swift/llama.cpp/build-apple/llama.xcframework
        key: llama-xcframework-${{ hashFiles('llmfarm_core.swift/llama.cpp/CMakeLists.txt', 'llmfarm_core.swift/llama.cpp/ggml/**', 'llmfarm_core.swift/llama.cpp/src/**') }}
        restore-keys: |
          llama-xcframework-

    - name: Build llama.xcframework
      if: steps.cache-llama.outputs.cache-hit != 'true'
      run: |
        cd llmfarm_core.swift/llama.cpp
        if [ -f "build-xcframework.sh" ]; then
          chmod +x build-xcframework.sh
          ./build-xcframework.sh
        else
          echo "Скрипт build-xcframework.sh не найден!"
          exit 1
        fi
        cd ../../..

    - name: Verify llama.xcframework exists
      run: |
        if [ ! -d "llmfarm_core.swift/llama.cpp/build-apple/llama.xcframework" ]; then
          echo "ОШИБКА: llama.xcframework отсутствует!"
          exit 1
        fi
        echo "OK: llama.xcframework на месте"

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/org.swift.swiftpm
          .build
          build/SourcePackages
        key: spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
        restore-keys: |
          spm-

    - name: Cache Xcode DerivedData
      uses: actions/cache@v4
      with:
        path: build
        key: derived-${{ hashFiles('LLMFarm/**/*.swift', 'LLMFarm.xcodeproj/project.pbxproj') }}
        restore-keys: |
          derived-

    - name: Build the app (Unsigned)
      run: |
        echo "=== Все схемы проекта ==="
        xcodebuild -list -project LLMFarm.xcodeproj

        SCHEME_NAME=$(xcodebuild -list -project LLMFarm.xcodeproj | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' | grep -i "LLMFarm" | grep -vi "test" | grep -vi "finetune" | head -1 | xargs)

        echo "=== Выбрана схема: $SCHEME_NAME ==="

        if [ -z "$SCHEME_NAME" ]; then
          echo "Не удалось найти подходящую схему!"
          exit 1
        fi

        xcodebuild clean build \
          -project LLMFarm.xcodeproj \
          -scheme "$SCHEME_NAME" \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath ./build \
          MARKETING_VERSION=2.0 \
          CURRENT_PROJECT_VERSION=2.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Verify Info.plist changes
      run: |
        APP_PATH=$(find ./build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
        echo "=== .app: $APP_PATH ==="
        PLIST="$APP_PATH/Info.plist"
        echo "CFBundleDisplayName:  $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" 2>/dev/null)"
        echo "CFBundleName:         $(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST" 2>/dev/null)"
        echo "CFBundleShortVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" 2>/dev/null)"
        echo "CFBundleVersion:      $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST" 2>/dev/null)"

    - name: Package into IPA
      run: |
        mkdir -p Payload
        find ./build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -exec cp -r {} Payload/ \;
        zip -r LLMFarm.ipa Payload
        echo "=== Размер .ipa ==="
        ls -lh LLMFarm.ipa

    - name: Upload IPA (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: LLMFarm-IPA
        path: LLMFarm.ipa

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

    - name: Get llama.cpp version
      id: llama_version
      run: |
        cd llmfarm_core.swift/llama.cpp
        VERSION=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Get IPA size
      id: ipa_size
      run: |
        SIZE=$(stat -f%z LLMFarm.ipa 2>/dev/null || stat -c%s LLMFarm.ipa)
        SIZE_MB=$((SIZE / 1024 / 1024))
        echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ steps.date.outputs.date }}
        name: "LLMFarm playerheart 2.0 build ${{ steps.date.outputs.date }}"
        body: |
          Автоматическая сборка LLMFarm playerheart.

          **Приложение:** LLMFarm playerheart
          **Версия:** 2.0
          **Дата:** ${{ steps.date.outputs.date }}
          **Commit:** ${{ github.sha }}
          **llama.cpp:** ${{ steps.llama_version.outputs.version }}
          **Размер .ipa:** ~${{ steps.ipa_size.outputs.size_mb }} МБ

          Неподписанный `.ipa` — подпиши его в ESign перед установкой.

          **Демо-модель:** Qwen2.5-0.5B-Instruct Q4_K_M.
        files: LLMFarm.ipa
        draft: false
        prerelease: false
